name: build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify preinstalled .NET
        run: dotnet --info

      - name: Restore
        run: dotnet restore OMSI-Compatible-Runtime.slnx

      - name: Build x64
        run: dotnet build OMSI-Compatible-Runtime.slnx -c Release --no-restore

      - name: Run synthetic world smoke test
        run: dotnet run --project tests/OMSICompatible.SmokeTests/OMSICompatible.SmokeTests.csproj -c Release --no-build

      - name: Publish Launcher x64
        run: >
          dotnet publish src/OMSICompatible.Launcher/OMSICompatible.Launcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:UseAppHost=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/OMSI-Compatible-Runtime-alpha-ui-win-x64

      - name: Publish Runtime x64
        run: >
          dotnet publish src/OMSICompatible.Runtime/OMSICompatible.Runtime.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:UseAppHost=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/OMSI-Compatible-Runtime-alpha-ui-win-x64/Runtime

      - name: Add test instructions
        shell: pwsh
        run: |
          @'
          OMSI Compatible Runtime x64 - PRE-ALPHA UI (PORTABLE SELF-CONTAINED)

          INÍCIO
          ======
          IMPORTANTE:
          Extraia TODO o conteúdo do ZIP antes de executar.
          Não execute o EXE de dentro do ZIP.

          Abra:
            OMSICompatible.Launcher.exe

          No launcher:
          1. Clique em Procurar.
          2. Selecione a pasta raiz do conteúdo OMSI.
             Exemplo: G:\Games\OMSI 2 Steam Edition
          3. Escolha o mapa e o ponto inicial.
          4. Escolha o ônibus por Carroceria > Modelo > Skin.
             Os três níveis vêm do [friendlyname] do arquivo .bus.
          5. Quando houver Preview.png/preview.jpg na pasta do veículo,
             a imagem é mostrada na seleção.
          6. Para explorar somente o mapa, marque "Iniciar sem ônibus".
          7. Clique em JOGAR.

          O launcher usa picture.jpg/preview do mapa quando disponível.
          O loading mostra etapas reais do carregamento.
          O modo "Iniciar sem ônibus" abre o mapa em câmera livre e não
          carrega meshes, scripts ou materiais de veículo.
          O jogo não inicia Omsi.exe.

          CONFIGURAÇÕES
          =============
          Use o atalho "Configurações" na tela principal.
          A tela preserva as áreas do OMSI:
          - Geral
          - Avançado
          - Gráficos
          - Gráficos avançados
          - Som
          - Tráfego IA
          - Teclado
          - Game Controller
          - Runtime x64

          É possível importar o options.cfg da instalação e os perfis .oop
          encontrados em option_presets sem sobrescrever o arquivo original.
          Teclado e Game Controller leem os arquivos da pasta Inputs.
          Ao salvar Inputs, o launcher pede confirmação e cria backup.

          CONTROLES OMSI - MODO DIRIGIR
          =============================
          Num 8       Acelerador
          Num 2       Aumentar freio de serviço
          Num +       Liberar freio
          Num 4 / 6   Direção esquerda/direita
          Num 5       Centralizar direção
          D / N / R   Marcha
          E           Sistema elétrico
          M           Motor
          Num .       Freio de estacionamento
          Num -       Freio de parada
          O           Direção pelo mouse

          MODO MOUSE (O)
          ==============
          Mouse esquerda/direita  Direção
          Mouse para cima         Acelerador
          Mouse para baixo        Freio
          Botão direito           Sair do modo mouse

          DESENVOLVIMENTO / CÂMERA LIVRE
          ==============================
          Tab         Alternar dirigir/câmera livre
          WASD        Movimento da câmera
          Q / E       Descer/subir
          RMB + mouse Olhar
          Shift       Mais rápido
          Ctrl        Mais lento
          R           Reenquadrar câmera livre
          F5          Resetar veículo no modo dirigir

          ATALHOS DO LAUNCHER
          ===================
          Pasta OMSI
          Mapas
          Veículos
          Logs
          Criar atalho na Área de Trabalho

          NORMALIZAÇÃO DE EIXOS OMSI
          ==========================
          Esta build corrige meshes O3D/X para:
          X = lateral
          Y = frente/trás
          Z = altura
          convertidos corretamente para o renderer X/Y-up/Z.

          ESCOPO ATUAL
          ============
          - Runtime Windows x64 independente
          - Launcher gráfico
          - Loading screen moderno
          - Leitura de mapas/tiles
          - Terreno 3D real
          - Splines/ruas em desenvolvimento
          - Ônibus OMSI real carregado por .bus/model.cfg
          - Câmeras F1/F2/F3/F4, horário e bilhetagem
          - Espelhos/reflexões D3D11 iniciais
          - Física baseada em eixos/raio de giro do .bus
          - Manifesto de scripts OMSI
          - VM RPN inicial em desenvolvimento

          Ainda em desenvolvimento:
          - compatibilidade total de scripts/animações
          - portas/luzes/instrumentos dinâmicos
          - sons/IBIS/tráfego/passageiros
          - veículos articulados/acoplados completos
          '@ | Set-Content -Encoding UTF8 artifacts/OMSI-Compatible-Runtime-alpha-ui-win-x64/README-TEST.txt

      - name: Upload x64 UI alpha
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Compatible-Runtime-alpha-ui-win-x64-portable
          path: artifacts/OMSI-Compatible-Runtime-alpha-ui-win-x64
          if-no-files-found: error
          compression-level: 6
