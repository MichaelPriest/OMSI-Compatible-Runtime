name: Native Rust compatibility core

on:
  push:
    branches:
      - fix/runtime-visual-controls-pass
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  omsi-compat-core:
    name: Test omsi-compat-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/omsi-compat-core
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
